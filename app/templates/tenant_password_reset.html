<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>Password Reset - Dons Premier Tenant Portal</title>
    <meta name="description" content="Reset your Dons Premier Tenant Portal password securely." />
    <link rel="canonical" href="https://portal.donspremier.com.au/tenant/forgot-password" />
    <meta property="og:site_name" content="Dons Premier Estate Agents" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dons Premier Tenant Portal" />
    <meta property="og:description" content="Secure tenant access for maintenance requests and tenancy updates." />
    <meta property="og:url" content="https://portal.donspremier.com.au/tenant/forgot-password" />
    <meta property="og:image" content="https://portal.donspremier.com.au/static/tenant-portal-preview.png?v=2" />
    <meta property="og:image:secure_url" content="https://portal.donspremier.com.au/static/tenant-portal-preview.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dons Premier Tenant Portal preview" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dons Premier Tenant Portal" />
    <meta name="twitter:description" content="Secure tenant access for maintenance requests and tenancy updates." />
    <meta name="twitter:image" content="https://portal.donspremier.com.au/static/tenant-portal-preview.png?v=2" />
    <link rel="icon" href="/static/favicon.ico?v=1" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=1" />
    <style>
      :root{
        --ink:#0b0f17;
        --muted:#667085;
        --line:#dbe4ef;
        --gold:#cda24a;
        --cream:#fffaf0;
      }
      *{box-sizing:border-box}
      html,body{min-height:100%;margin:0}
      body{
        color:var(--ink);
        font-family:"Segoe UI","Aptos",ui-sans-serif,system-ui,sans-serif;
        background:
          radial-gradient(circle at 82% 4%, rgba(205,162,74,.28), transparent 32%),
          linear-gradient(145deg, #f8fbfb, #edf3f4 58%, #faf2dc);
        overflow-x:hidden;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
      }
      .page{
        min-height:100svh;
        display:grid;
        place-items:center;
        padding:24px;
      }
      .card{
        width:min(520px, 100%);
        border:1px solid rgba(15,23,42,.08);
        border-radius:34px;
        padding:34px;
        background:rgba(255,255,255,.9);
        box-shadow:0 24px 70px rgba(15,23,42,.16);
      }
      .brand{
        display:flex;
        align-items:center;
        gap:16px;
        margin-bottom:26px;
      }
      .logo{
        width:104px;
        height:104px;
        object-fit:contain;
        border-radius:28px;
        background:#050505;
        border:1px solid rgba(15,23,42,.12);
        padding:8px;
        box-shadow:0 18px 36px rgba(15,23,42,.18);
      }
      .brand strong{display:block;font-size:18px}
      .brand span{display:block;margin-top:3px;color:var(--muted);font-size:13px}
      h1{
        margin:0;
        font-size:clamp(34px, 6vw, 48px);
        line-height:.98;
        letter-spacing:-.06em;
      }
      p{
        margin:12px 0 24px;
        color:var(--muted);
        line-height:1.6;
      }
      .field{
        display:grid;
        gap:8px;
        margin-bottom:16px;
      }
      label{
        color:#344054;
        font-size:13px;
        font-weight:850;
      }
      input{
        width:100%;
        min-height:54px;
        border:1px solid var(--line);
        border-radius:16px;
        padding:0 16px;
        background:#fff;
        color:var(--ink);
        font:inherit;
        outline:none;
        transition:border-color .18s ease, box-shadow .18s ease;
      }
      input:focus{
        border-color:var(--gold);
        box-shadow:0 0 0 4px rgba(205,162,74,.16);
      }
      .btn{
        width:100%;
        min-height:54px;
        border:1px solid #080b11;
        border-radius:18px;
        padding:0 20px;
        color:#fff;
        background:linear-gradient(135deg, #0b0f17, #9a7820);
        font:inherit;
        font-weight:900;
        cursor:pointer;
        transition:transform .2s ease, background-color .2s ease;
      }
      .btn:hover{transform:translateY(-1px);background:#050505}
      .links{
        display:flex;
        justify-content:center;
        margin-top:18px;
      }
      a{
        color:#78580f;
        font-weight:850;
        text-decoration:none;
      }
      a:hover{text-decoration:underline}
      .status{
        display:none;
        margin-top:16px;
        padding:14px 16px;
        border-radius:16px;
        background:#eef4ff;
        border:1px solid #c7d7fe;
        color:#344054;
        line-height:1.45;
      }
      .status.show{display:block}
      .status.error{background:#fff0f0;border-color:#ffd0d0;color:#842029}
      .status.success{background:#ecfdf3;border-color:#a7f3d0;color:#047857}
      .hidden{display:none !important}
      @media (max-width: 560px){
        .page{padding:14px}
        .card{padding:22px;border-radius:28px}
        .brand{align-items:flex-start}
        .logo{width:88px;height:88px;border-radius:24px}
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="brand">
          <img class="logo" src="/static/dons_premier_transparent_v2.png" alt="Dons Premier crest" />
          <div>
            <strong>Dons Premier Estate Agents</strong>
            <span>Tenant Portal</span>
          </div>
        </div>

        <div id="forgotPanel" class="{% if mode != 'forgot' %}hidden{% endif %}">
          <h1>Reset your password.</h1>
          <p>Enter your tenant portal email and we will send a secure reset link if the account exists.</p>
          <form id="tenantForgotForm" novalidate>
            <div class="field">
              <label for="tenantForgotEmail">Email address</label>
              <input id="tenantForgotEmail" type="email" inputmode="email" autocomplete="email" placeholder="tenant@example.com" required />
            </div>
            <button class="btn" type="submit">Send reset link</button>
            <div id="tenantForgotStatus" class="status" role="status" aria-live="polite"></div>
          </form>
        </div>

        <div id="resetPanel" class="{% if mode != 'reset' %}hidden{% endif %}">
          <h1>Create new password.</h1>
          <p>Use at least 12 characters with uppercase, lowercase, number, and symbol.</p>
          <form id="tenantResetForm" novalidate>
            <input id="tenantResetToken" type="hidden" value="{{ token }}" />
            <div class="field">
              <label for="tenantResetPassword">New password</label>
              <input id="tenantResetPassword" type="password" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="tenantResetConfirm">Confirm password</label>
              <input id="tenantResetConfirm" type="password" autocomplete="new-password" required />
            </div>
            <button class="btn" type="submit">Update password</button>
            <div id="tenantResetStatus" class="status" role="status" aria-live="polite"></div>
          </form>
        </div>

        <div class="links">
          <a href="/tenant/login">Back to tenant login</a>
        </div>
      </section>
    </main>

    <script>
      async function tenantApi(path, options) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...((options && options.headers) || {})
          }
        });
        const text = await response.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
        if (!response.ok) throw new Error(data.detail || "Request failed.");
        return data;
      }

      function setStatus(id, message, type) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = message || "";
        el.classList.toggle("show", !!message);
        el.classList.toggle("error", type === "error");
        el.classList.toggle("success", type === "success");
      }

      const forgotForm = document.getElementById("tenantForgotForm");
      if (forgotForm) {
        forgotForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          const email = (document.getElementById("tenantForgotEmail").value || "").trim();
          if (!email) {
            setStatus("tenantForgotStatus", "Enter your email address.", "error");
            return;
          }
          try {
            const data = await tenantApi("/tenant/api/forgot-password", {
              method: "POST",
              body: JSON.stringify({ email })
            });
            setStatus("tenantForgotStatus", data.message || "If that email is registered, a reset link has been sent.", "success");
          } catch (error) {
            setStatus("tenantForgotStatus", error.message || "Could not request a reset link.", "error");
          }
        });
      }

      const resetForm = document.getElementById("tenantResetForm");
      if (resetForm) {
        resetForm.addEventListener("submit", async function (event) {
          event.preventDefault();
          const token = (document.getElementById("tenantResetToken").value || "").trim();
          const new_password = document.getElementById("tenantResetPassword").value || "";
          const confirm = document.getElementById("tenantResetConfirm").value || "";
          if (!token) {
            setStatus("tenantResetStatus", "Reset token is missing. Please request a new link.", "error");
            return;
          }
          if (new_password !== confirm) {
            setStatus("tenantResetStatus", "Passwords do not match.", "error");
            return;
          }
          try {
            const data = await tenantApi("/tenant/api/reset-password", {
              method: "POST",
              body: JSON.stringify({ token, new_password })
            });
            setStatus("tenantResetStatus", data.message || "Password updated. You can now log in.", "success");
            document.getElementById("tenantResetPassword").value = "";
            document.getElementById("tenantResetConfirm").value = "";
          } catch (error) {
            setStatus("tenantResetStatus", error.message || "Could not reset password.", "error");
          }
        });
      }
    </script>
  </body>
</html>
